<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartThings TV Controller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SamsungOne', 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0c2461, #1e3799);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(45deg, #3498db, #2ecc71);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #2ecc71, #3498db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #a0b3e0;
            font-size: 1.1rem;
        }

        .device-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .device-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .device-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .device-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #3498db, #2ecc71);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .device-name {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .device-status {
            padding: 5px 15px;
            border-radius: 20px;
            background: #2ecc71;
            color: white;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-section {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 20px;
        }

        .section-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #2ecc71;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .remote-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .nav-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .nav-center {
            grid-column: 2;
            grid-row: 2;
        }

        .key-btn {
            padding: 18px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .key-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .key-btn:active {
            transform: translateY(0);
            background: rgba(255, 255, 255, 0.3);
        }

        .power-btn {
            background: linear-gradient(45deg, #e74c3c, #c0392b) !important;
        }

        .power-btn:hover {
            background: linear-gradient(45deg, #ff6b6b, #e74c3c) !important;
        }

        .media-btn {
            background: linear-gradient(45deg, #9b59b6, #8e44ad);
        }

        .media-btn:hover {
            background: linear-gradient(45deg, #a569bd, #9b59b6);
        }

        .number-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .number-btn {
            padding: 15px;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .number-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .channel-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .channel-input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
        }

        .channel-input::placeholder {
            color: #a0b3e0;
        }

        .volume-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .volume-btn {
            padding: 12px 20px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .volume-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .app-btn {
            padding: 15px 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .app-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .app-icon {
            font-size: 24px;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .quick-action {
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .quick-action:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .quick-action i {
            display: block;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .log-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .log-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #f39c12;
        }

        #log-area {
            width: 100%;
            height: 120px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            color: #ecf0f1;
            font-family: monospace;
            resize: none;
        }

        @media (max-width: 768px) {
            .controls-grid {
                grid-template-columns: 1fr;
            }
            
            .remote-pad, .nav-pad, .number-pad {
                grid-template-columns: repeat(3, 1fr);
            }
            
            h1 {
                font-size: 2rem;
            }
        }

        .arrow-up { transform: rotate(0deg); }
        .arrow-right { transform: rotate(90deg); }
        .arrow-down { transform: rotate(180deg); }
        .arrow-left { transform: rotate(270deg); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">📱</div>
                <div>
                    <h1>SmartThings TV Controller</h1>
                    <div class="subtitle">Control your Samsung TV like the official SmartThings app</div>
                </div>
            </div>
        </header>

        <div class="device-card">
            <div class="device-header">
                <div class="device-info">
                    <div class="device-icon">📺</div>
                    <div class="device-name">Samsung QLED TV</div>
                </div>
                <div class="device-status">Connected</div>
            </div>

            <div class="controls-grid">
                <!-- Power & Basic Controls -->
                <div class="control-section">
                    <h3 class="section-title">⚡ Power & Source</h3>
                    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                        <button class="key-btn power-btn" onclick="sendKey('KEY_POWER')">🔴 Power</button>
                        <button class="key-btn" onclick="sendKey('KEY_SOURCE')">📡 Source</button>
                    </div>
                    
                    <div class="quick-actions">
                        <div class="quick-action" onclick="sendKey('KEY_HOME')">
                            <span>🏠</span>
                            <span>Home</span>
                        </div>
                        <div class="quick-action" onclick="sendKey('KEY_MENU')">
                            <span>⚙️</span>
                            <span>Menu</span>
                        </div>
                        <div class="quick-action" onclick="sendKey('KEY_CONTENTS')">
                            <span>🎬</span>
                            <span>Smart Hub</span>
                        </div>
                        <div class="quick-action" onclick="sendKey('KEY_TOOLS')">
                            <span>🔧</span>
                            <span>Tools</span>
                        </div>
                    </div>
                </div>

                <!-- Navigation Pad -->
                <div class="control-section">
                    <h3 class="section-title">🎮 Navigation</h3>
                    <div class="nav-pad">
                        <div></div>
                        <button class="key-btn" onclick="sendKey('KEY_UP')">
                            <span>⬆️</span> UP
                        </button>
                        <div></div>
                        
                        <button class="key-btn" onclick="sendKey('KEY_LEFT')">
                            <span>⬅️</span> LEFT
                        </button>
                        <button class="key-btn nav-center" onclick="sendKey('KEY_ENTER')">
                            <span>🔘</span> OK
                        </button>
                        <button class="key-btn" onclick="sendKey('KEY_RIGHT')">
                            <span>➡️</span> RIGHT
                        </button>
                        
                        <div></div>
                        <button class="key-btn" onclick="sendKey('KEY_DOWN')">
                            <span>⬇️</span> DOWN
                        </button>
                        <div></div>
                    </div>
                    
                    <div style="display: flex; gap: 10px;">
                        <button class="key-btn" onclick="sendKey('KEY_RETURN')">↩️ Return</button>
                        <button class="key-btn" onclick="sendKey('KEY_EXIT')">🚪 Exit</button>
                    </div>
                </div>

                <!-- Volume & Channels -->
                <div class="control-section">
                    <h3 class="section-title">🔊 Volume & Channels</h3>
                    
                    <div class="volume-controls">
                        <button class="volume-btn" onclick="sendKey('KEY_VOLUP')">🔊 Vol +</button>
                        <button class="volume-btn" onclick="sendKey('KEY_MUTE')">🔇 Mute</button>
                        <button class="volume-btn" onclick="sendKey('KEY_VOLDOWN')">🔈 Vol -</button>
                    </div>
                    
                    <div class="channel-controls">
                        <input type="text" id="channel-input" class="channel-input" placeholder="Enter channel..." maxlength="4">
                        <button class="key-btn" onclick="changeChannel()">Set</button>
                    </div>
                    
                    <div style="display: flex; gap: 10px;">
                        <button class="key-btn" onclick="sendKey('KEY_CHUP')">📺 CH +</button>
                        <button class="key-btn" onclick="sendKey('KEY_CHDOWN')">📺 CH -</button>
                        <button class="key-btn" onclick="sendKey('KEY_PRECH')">🔄 PREV</button>
                    </div>
                </div>

                <!-- Number Pad -->
                <div class="control-section">
                    <h3 class="section-title">🔢 Number Pad</h3>
                    <div class="number-pad">
                        <button class="number-btn" onclick="sendKey('KEY_1')">1</button>
                        <button class="number-btn" onclick="sendKey('KEY_2')">2</button>
                        <button class="number-btn" onclick="sendKey('KEY_3')">3</button>
                        <button class="number-btn" onclick="sendKey('KEY_4')">4</button>
                        <button class="number-btn" onclick="sendKey('KEY_5')">5</button>
                        <button class="number-btn" onclick="sendKey('KEY_6')">6</button>
                        <button class="number-btn" onclick="sendKey('KEY_7')">7</button>
                        <button class="number-btn" onclick="sendKey('KEY_8')">8</button>
                        <button class="number-btn" onclick="sendKey('KEY_9')">9</button>
                        <button class="number-btn" onclick="sendKey('KEY_RED')">🔴 RED</button>
                        <button class="number-btn" onclick="sendKey('KEY_GREEN')">🟢 GREEN</button>
                        <button class="number-btn" onclick="sendKey('KEY_YELLOW')">🟡 YELLOW</button>
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <button class="number-btn" onclick="sendKey('KEY_0')">0</button>
                        <button class="number-btn" onclick="sendKey('KEY_BLUE')">🔵 BLUE</button>
                        <button class="number-btn" onclick="sendKey('KEY_DASH')">— —</button>
                    </div>
                </div>

                <!-- Media Controls -->
                <div class="control-section">
                    <h3 class="section-title">🎵 Media Controls</h3>
                    <div class="remote-pad">
                        <button class="key-btn media-btn" onclick="sendKey('KEY_REWIND')">⏪ Rewind</button>
                        <button class="key-btn media-btn" onclick="sendKey('KEY_PLAY')">▶️ Play</button>
                        <button class="key-btn media-btn" onclick="sendKey('KEY_FF')">⏩ FF</button>
                        
                        <button class="key-btn media-btn" onclick="sendKey('KEY_REC')">🔴 REC</button>
                        <button class="key-btn media-btn" onclick="sendKey('KEY_PAUSE')">⏸️ Pause</button>
                        <button class="key-btn media-btn" onclick="sendKey('KEY_STOP')">⏹️ Stop</button>
                        
                        <button class="key-btn media-btn" onclick="sendKey('KEY_PREVIOUS')">⏮️ Previous</button>
                        <button class="key-btn media-btn" onclick="sendKey('KEY_GUIDE')">📋 Guide</button>
                        <button class="key-btn media-btn" onclick="sendKey('KEY_NEXT')">⏭️ Next</button>
                    </div>
                </div>

                <!-- Apps -->
                <div class="control-section">
                    <h3 class="section-title">📱 Quick Apps</h3>
                    <div class="apps-grid">
                        <button class="app-btn" onclick="launchApp('org.tizen.browser')">
                            <span class="app-icon">🌐</span>
                            <span>Browser</span>
                        </button>
                        <button class="app-btn" onclick="launchApp('111299001912')">
                            <span class="app-icon">📺</span>
                            <span>Netflix</span>
                        </button>
                        <button class="app-btn" onclick="launchApp('12345')">
                            <span class="app-icon">🎬</span>
                            <span>YouTube</span>
                        </button>
                        <button class="app-btn" onclick="launchApp('3201606009684')">
                            <span class="app-icon">🎵</span>
                            <span>Spotify</span>
                        </button>
                        <button class="app-btn" onclick="launchApp('3201901017640')">
                            <span class="app-icon">🎮</span>
                            <span>Disney+</span>
                        </button>
                        <button class="app-btn" onclick="launchApp('3201608014058')">
                            <span class="app-icon">🍿</span>
                            <span>Prime Video</span>
                        </button>
                    </div>
                    
                    <div style="margin-top: 15px; text-align: center;">
                        <button class="key-btn" onclick="openSmartHub()" style="width: 100%;">🎬 Open Smart Hub</button>
                    </div>
                </div>
            </div>

            <div class="log-panel">
                <h3 class="log-title">📋 Command Log</h3>
                <textarea id="log-area" readonly></textarea>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = window.location.origin;
        
        async function sendKey(key) {
            logMessage(`Sending: ${key}`);
            try {
                const response = await fetch(`${BASE_URL}/key/${key}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const result = await response.json();
                if (result.success) {
                    logMessage(`✓ Success: ${key}`);
                } else {
                    logMessage(`✗ Failed: ${key}`);
                }
            } catch (error) {
                logMessage(`✗ Error: ${error.message}`);
            }
        }
        
        function changeChannel() {
            const channelInput = document.getElementById('channel-input');
            const channel = channelInput.value.trim();
            
            if (!channel || isNaN(channel)) {
                logMessage('Please enter a valid channel number');
                return;
            }
            
            // Clear the input field
            channelInput.value = '';
            
            // Send each digit individually
            for (let digit of channel) {
                sendKey(`KEY_${digit}`);
            }
            
            // Press ENTER after entering the channel
            setTimeout(() => {
                sendKey('KEY_ENTER');
            }, 500);
        }
        
        async function launchApp(appId) {
            logMessage(`Launching app: ${appId}`);
            try {
                const response = await fetch(`${BASE_URL}/launch/${appId}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const result = await response.json();
                if (result.success) {
                    logMessage(`✓ App launched: ${appId}`);
                } else {
                    logMessage(`✗ Failed to launch app: ${appId}`);
                }
            } catch (error) {
                logMessage(`✗ Error launching app: ${error.message}`);
            }
        }
        
        function openSmartHub() {
            sendKey('KEY_CONTENTS'); // This opens the Smart Hub on Samsung TVs
        }
        
        function logMessage(message) {
            const logArea = document.getElementById('log-area');
            const timestamp = new Date().toLocaleTimeString();
            logArea.value += `[${timestamp}] ${message}\n`;
            logArea.scrollTop = logArea.scrollHeight;
        }
        
        // Check connection status
        fetch(`${BASE_URL}/status`)
            .then(response => response.json())
            .then(data => {
                logMessage('SmartThings TV Controller Ready!');
                logMessage(`Connected to TV: ${data.tv_ip}`);
            })
            .catch(error => {
                logMessage(`Connection error: ${error.message}`);
            });
        
        // Allow pressing Enter in channel input
        document.getElementById('channel-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                changeChannel();
            }
        });
        
        // Add keyboard shortcuts for quick access
        document.addEventListener('keydown', function(e) {
            // Only process if not typing in an input field
            if (e.target.tagName === 'INPUT') return;
            
            switch(e.key) {
                case 'ArrowUp':
                    sendKey('KEY_UP');
                    break;
                case 'ArrowDown':
                    sendKey('KEY_DOWN');
                    break;
                case 'ArrowLeft':
                    sendKey('KEY_LEFT');
                    break;
                case 'ArrowRight':
                    sendKey('KEY_RIGHT');
                    break;
                case 'Enter':
                    sendKey('KEY_ENTER');
                    break;
                case 'Backspace':
                    sendKey('KEY_RETURN');
                    break;
                case 'Escape':
                    sendKey('KEY_EXIT');
                    break;
                case '+':
                    sendKey('KEY_VOLUP');
                    break;
                case '-':
                    sendKey('KEY_VOLDOWN');
                    break;
                case 'm':
                case 'M':
                    sendKey('KEY_MUTE');
                    break;
                case 'h':
                case 'H':
                    sendKey('KEY_HOME');
                    break;
                case ' ':
                    sendKey('KEY_PLAY');
                    e.preventDefault(); // Prevent space from scrolling page
                    break;
            }
        });
    </script>
</body>
</html>
